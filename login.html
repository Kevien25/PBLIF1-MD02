<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Aplikasi Daftar Tugas dan Jadwal Belajar Mahasiswa</title>
<link rel="stylesheet" href="login.css">
</head>
<body>
<main class="kotak">
  <img src="logo_aplikasi.png" alt="Logo">
  <h1>Aplikasi Daftar Tugas dan Jadwal Belajar Mahasiswa</h1>
  <div class="card">
    <div class="card-header">Login</div>
    <div class="card-body">
      <form action="index.html" method="get">
        <div class="campur"><label for="username">Username</label><input type="text" id="username" name="username" autocomplete="off" required></div>
        <div class="campur"><label for="password">Password</label><input type="password" id="password" autocomplete="off" required></div>
        <button type="submit" class="btn ">Login</button>
      </form>
      <p class="tautan">Belum punya akun? <a href="daftar.html">Daftar</a></p>
    </div>
  </div>
</main>
</body>
</html>
